fragment PromotionFields on Promotion {
  __typename
  activated
  amountCents
  autoApply
  deactivateAfterAmountIncludingTaxCents
  deactivateAfterTimes
  deactivationStrategy
  discountType
  id
  percentDiscount
  publicName
  title
  ... on BillingCyclePromotion {
    ...BillingCyclePromotionFields
  }
  ... on OrderDiscountPromotion {
    ...OrderDiscountPromotionFields
  }
}
